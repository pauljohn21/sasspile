[package]
name = "lightforger"
version = "0.1.0"
edition = "2024"
description = "Lightforger / 铸光者 — Reactive Sass compiler built with rxrust"
license = "MIT"
rust-version = "1.99"

[lib]
name = "lightforger"
path = "src/lib.rs"

[dependencies]
rxrust = "1.0.0-rc.5"
tracing = "0.1"
indexmap = "2"
lasso = "0.7"
phf = { version = "0.11", features = ["macros"] }
codemap = "0.1.3"
once_cell = "1.15.0"

[dev-dependencies]
