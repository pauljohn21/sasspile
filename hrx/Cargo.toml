[package]
name = "hrx"
version = "0.1.0"
edition = "2024"
description = "HRX (Human Readable Archive) parser and writer for Rust"
license = "MIT"
repository.workspace = true

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tracing-test = "0.2"

[[bin]]
name = "hrx"
path = "src/main.rs"

[lib]
name = "hrx"
path = "src/lib.rs"
