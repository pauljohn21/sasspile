[package]
name = "sasspile"
version = "0.9.1"
edition = "2024"
rust-version = "1.97"
description = "A Rust-native Sass compiler built from spec, not from dart-sass"
license = "MIT"
repository = "https://github.com/pauljohn21/sasspile"
homepage = "https://github.com/pauljohn21/sasspile"
documentation = "https://docs.rs/sasspile"
readme = "README.md"
keywords = ["sass", "scss", "css", "compiler", "preprocessor"]
categories = ["compilers", "development-tools", "web-programming"]
exclude = [
    "sass-spec/",
    "bootstrap/",
    "element-plus/",
    "target/",
    "tests/",
]

[lib]
name = "sasspile"
path = "src/lib.rs"

[dependencies]
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
debug = true  # Keep debug info for tracing in release builds
