[package]
name = "sasspile"
version = "0.9.5"
edition = "2024"
rust-version = "1.97"
description = "A pure Rust SCSS compiler — functional style, type-safe pipeline"
license = "MIT"
repository = "https://github.com/pauljohn21/sasspile"
homepage = "https://github.com/pauljohn21/sasspile"
documentation = "https://docs.rs/sasspile"
readme = "README.md"
authors = ["pauljohn21"]
keywords = ["sass", "scss", "css", "compiler", "transpiler"]
categories = ["parser-implementations", "text-processing", "development-tools"]
exclude = [
    "tests/fixtures/**",
    "tests/sass-spec/**",
    "tests/element-plus/**",
    "tests/bootstrap/**",
    "sass-spec/**",
    "bootstrap/**",
    "element-plus/**",
    "book/",
    "rust/",
    "examples/",
    "DESIGN.md",
    "docs/",
    "openspec/",
    ".github/",
    ".claude/",
    ".codegraph/",
    "*.code-workspace",
]

[dependencies]
thiserror = "2"
im = "15"  # 不可变 HashMap —— 支持函数式状态传递
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "fmt"] }

# 颜色处理 —— HSL/RGB/Lab/OKLab 等色彩空间转换
color = { version = "0.3", default-features = false, features = ["std"] }

[features]
default = ["tracing"]
tracing = ["dep:tracing", "dep:tracing-subscriber"]

[[bin]]
name = "sasspile"
path = "src/main.rs"

[lib]
name = "sasspile"
path = "src/lib.rs"

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "lexer_bench"
harness = false

[[bench]]
name = "parser_bench"
harness = false

[[bench]]
name = "eval_bench"
harness = false

[[bench]]
name = "compile_bench"
harness = false
