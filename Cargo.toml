[package]
name = "scss-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Pure Rust SCSS compiler"
license = "MIT"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "fmt"] }

[features]
default = ["tracing"]
tracing = ["dep:tracing", "dep:tracing-subscriber"]

[dev-dependencies]
hrx-auditor = { path = "../scss-rust" }
