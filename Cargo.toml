[workspace]
members = ["hrx", "sasslipe"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sass/sasslipe"
authors = ["sasslipe contributors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Error handling
thiserror = "2"
anyhow = "1"
# CLI
clap = { version = "4", features = ["derive"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Colored output
colored = "3"
# Schema
schemars = "1"
# Timestamp
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
