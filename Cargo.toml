[package]
name = "sasspile"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
description = "A pure Rust SCSS compiler — functional style, type-safe pipeline"
license = "MIT"
repository = "https://github.com/pauljohn21/sasspile"
documentation = "https://docs.rs/sasspile"
readme = "README.md"
authors = ["pauljohn21"]
keywords = ["sass", "scss", "css", "compiler"]
categories = ["parser-implementations", "text-processing"]

[dependencies]
thiserror = "2"
im = "15"  # 不可变 HashMap —— 支持函数式状态传递
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[[bin]]
name = "sasspile"
path = "src/main.rs"

[lib]
name = "sasspile"
path = "src/lib.rs"

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
