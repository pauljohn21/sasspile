[package]
name = "sasspile"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A Rust-native Sass compiler built from spec, not from dart-sass"
license = "MIT"

[lib]
name = "sasspile"
path = "src/lib.rs"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Test-only dependencies go here

[profile.release]
debug = true  # Keep debug info for tracing in release builds
