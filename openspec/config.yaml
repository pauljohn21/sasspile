schema: spec-driven

context: |
  Tech stack: Rust edition 2024, toolchain 1.97
  Project: scss-rs — 纯 Rust SCSS 编译器，全新重写
  All responses in Chinese; code, commands, filenames in English

  ## 架构
  入口 lib.rs 链式调用：Source::new(input).lex()?.parse()?.evaluate()?.serialize(style).into_string()
  管线类型状态机：Source → Lexed → Parsed → Evaluated → Serialized
  每个阶段是独立 struct，阶段间通过 TryFrom 转换
  Source/Lexed/Parsed 携带 base_path + load_paths
  Env 方法全部 self -> Self（builder 模式），enter_scope/exit_scope 管理作用域
  eval_xxx 接收 Env（move），返回 (Option<Vec<CssNode>>, Env)
  内建函数用 const 静态表 dispatch（不用 proc-macro）

  ## 禁止项
  1. 禁止 Python：不使用 python3/pip；脚本用 rust-script；测试用 #[test]
  2. 禁止 println!/eprintln!：所有代码（含 src/ 和 tests/）一律用 tracing 宏（info!/warn!/error!/debug!）
  3. 必须使用 tracing span：涉及跨函数/跨阶段的管道处理必须用 tracing::span! 记录上下文与耗时
  4. 禁止内联测试：src/ 保持纯生产代码，所有测试放在 tests/ 目录
  5. 单文件 ≤ 500 行：源码和测试分别计算，超出必须拆分
  6. 使用 SSH 方式推送 GitHub
  7. 禁止参照 dart-sass 的算法设计：dart-sass 有 GC，Rust 没有 GC。不能照搬 dart-sass 的递归/后处理模式——后处理递归会导致中间数据在调用栈上累积不释放（OOM 根因）。必须在求值阶段当场处理，利用 move 语义让每层数据在返回后被 drop

  ## 调试协议（强制）
  核心原则：禁止凭直觉猜测根因。所有 bug 修复必须基于 tracing trace 证据链。
  4 步流程：SPAN 插桩 → TRACE 采集 → 根因定位（引用具体 span + 字段值）→ 修复验证

  ## 代码查询
  优先使用 CodeGraph CLI（callers/impact/explore/node）

  ## Git 规范
  推送：SSH 方式 git push origin scss-rs（remote 名为 origin，指向 sasspile 仓库）
  只提交不推送：commit 后必须等用户确认

  ## 测试基线
  compile_test 19/19 + lex_test 29/29 + bs_spec 15/15 + sass_spec 1235/5362 = 23% + ep_full 10/121
  目标：对齐 sasspile 功能，sass-spec 从 23% 继续提升

